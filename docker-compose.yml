services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  cryptoweb:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8100 --proxy-headers --forwarded-allow-ips="*"
    ports:
      # Bind only to localhost — expose via nginx for production internet access
      - '127.0.0.1:8100:8100'
    environment:
      - ENV=${ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Set TRUST_PROXY=1 to trust X-Forwarded-For headers from Nginx Proxy Manager
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    restart: always
    healthcheck:
      # wget is available in alpine; checks that the HTTP server responds
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
