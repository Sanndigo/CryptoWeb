services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: share_user
      POSTGRES_PASSWORD: share_password
      POSTGRES_DB: sharedb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  cryptoweb:
    build: .
    ports:
      # Bind only to localhost — expose via nginx for production internet access
      - '127.0.0.1:8100:8100'
    environment:
      - ENV=production
      # Set CORS_ORIGINS to your domain(s) in production, e.g.:
      #   CORS_ORIGINS=https://example.com
      # Leave unset (or "*") for local-only deployments.
      - CORS_ORIGINS=
      # Set TRUST_PROXY=1 only when a trusted reverse proxy (nginx) is in front.
      # This enables X-Forwarded-For for accurate rate limiting per client IP.
      - TRUST_PROXY=0
      - DATABASE_URL=postgresql+asyncpg://share_user:share_password@postgres:5432/sharedb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: always
    healthcheck:
      # wget is available in alpine; checks that the HTTP server responds
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data: