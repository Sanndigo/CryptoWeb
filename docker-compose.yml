services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: share_user
      POSTGRES_PASSWORD: share_password
      POSTGRES_DB: sharedb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  cryptoweb:
    build: .
    ports:
      # Bind only to localhost — expose via nginx for production internet access
      - '127.0.0.1:8100:8100'
    environment:
      - ENV=${ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://share_user:share_password@postgres:5432/sharedb}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - postgres
      - redis
    restart: always
    healthcheck:
      # wget is available in alpine; checks that the HTTP server responds
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data: